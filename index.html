<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Voice Engine 4.5</title>
<style>
</style>
</head>
<body>
<button onclick="start()">Start</button>
<script>
async function start() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const audioCtx = new AudioContext();
  await audioCtx.audioWorklet.addModule('psola-processor.js');

  const source = audioCtx.createMediaStreamSource(stream);
  const psolaNode = new AudioWorkletNode(audioCtx, 'psola-processor');

  source.connect(psolaNode).connect(audioCtx.destination);
}
</script>
</body>
</html>
